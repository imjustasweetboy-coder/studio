<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO - EDI Multilenguaje</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CodeMirror 5 (Core + Dracula Theme + Modes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <!-- Pyodide CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header Navigation -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 px-4 md:px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="flex items-center justify-center p-1">
                <img src="assets/favicon.png" alt="Icono" class="w-10 h-10 object-contain">
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide flex items-center gap-2 text-white">
                    STUDIO
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Editor de Desarrollo Integrado Multilenguaje</p>
            </div>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="btn-mode-py" onclick="switchWorkspace('python')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-sky-500 text-slate-950 transition-all">
                <i class="fa-brands fa-python mr-1"></i> Python
            </button>
            <button id="btn-mode-web" onclick="switchWorkspace('web')" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-code mr-1"></i> Web Dev
            </button>
            <button id="btn-mode-dart" onclick="switchWorkspace('dart')" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition-all">
                <i class="fa-solid fa-mobile-screen mr-1"></i> Flutter
            </button>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2">
            <button onclick="clearCurrentOutput()" class="px-3 py-2 text-sm rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-all border border-slate-700">
                <i class="fa-solid fa-eraser"></i>
            </button>
            <button id="run-btn" onclick="executeCode()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition-all flex items-center gap-2">
                <i class="fa-solid fa-play"></i>
                <span class="hidden sm:inline">Ejecutar</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 p-3 min-h-0 bg-slate-950">
        
        <!-- Left Panel: Editor -->
        <div class="flex flex-col rounded-xl bg-slate-900 border border-slate-800 overflow-hidden shadow-xl">
            <!-- Dynamic File Bar & Subtabs -->
            <div class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div id="file-indicator" class="flex items-center gap-2 text-xs font-mono font-semibold uppercase text-sky-400">
                    <i class="fa-solid fa-file-code"></i>
                    <span id="current-filename">main.py</span>
                </div>
                
                <!-- Web Subtabs -->
                <div id="web-subtabs" class="hidden flex items-center gap-1">
                    <button onclick="switchWebTab('html')" id="tab-html" class="px-2.5 py-1 text-xs rounded bg-sky-500/20 text-sky-300 font-mono">index.html</button>
                    <button onclick="switchWebTab('css')" id="tab-css" class="px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-mono">style.css</button>
                    <button onclick="switchWebTab('js')" id="tab-js" class="px-2.5 py-1 text-xs rounded bg-slate-800 text-slate-400 font-mono">script.js</button>
                </div>
            </div>

            <!-- CodeMirror Target -->
            <div class="flex-1 relative overflow-hidden">
                <textarea id="code-editor"></textarea>
            </div>

            <!-- Touch Keyboard Quick-Keys Bar -->
            <div class="bg-slate-950 border-t border-slate-800 p-1.5 flex items-center gap-1 overflow-x-auto text-xs font-mono">
                <button onclick="insertSymbol('<')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">&lt;</button>
                <button onclick="insertSymbol('>')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">&gt;</button>
                <button onclick="insertSymbol('/')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">/</button>
                <button onclick="insertSymbol('{')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">{</button>
                <button onclick="insertSymbol('}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">}</button>
                <button onclick="insertSymbol('[')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">[</button>
                <button onclick="insertSymbol(']')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">]</button>
                <button onclick="insertSymbol('=')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">=</button>
                <button onclick="insertSymbol('&quot;')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">&quot;</button>
                <button onclick="insertSymbol(';')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">;</button>
                <button onclick="insertSymbol(':')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">:</button>
                <button onclick="insertSymbol('()')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">()</button>
                <button onclick="insertSymbol('=>')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">=&gt;</button>
            </div>
        </div>

        <!-- Right Panel: Output & Preview -->
        <div class="flex flex-col rounded-xl bg-slate-900 border border-slate-800 overflow-hidden shadow-xl">
            <div class="px-4 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-semibold uppercase text-emerald-400">
                    <i class="fa-solid fa-terminal"></i>
                    <span>Resultado / Previsualización</span>
                </div>
            </div>

            <div class="flex-1 relative bg-[#10121d] overflow-hidden flex flex-col">
                <!-- Text Terminal Console -->
                <div id="console-output" class="flex-1 p-4 overflow-y-auto font-mono text-sm leading-relaxed whitespace-pre-wrap break-words text-slate-200"></div>

                <!-- Web Render Frame -->
                <iframe id="web-preview" class="hidden w-full h-full border-0 bg-white"></iframe>

                <!-- Flutter UI Render Container -->
                <div id="flutter-preview" class="hidden w-full h-full p-4 overflow-y-auto flex items-center justify-center bg-slate-950">
                    <div class="w-full max-w-sm h-full max-h-[500px] border-4 border-slate-800 rounded-3xl bg-slate-900 shadow-2xl p-4 overflow-y-auto flex flex-col text-slate-100" id="flutter-stage">
                        <!-- Simulated Flutter Tree -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
